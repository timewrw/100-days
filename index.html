<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С полугодием, любимая! ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe3ec 0%, #ffb3c6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(223, 40, 107, 0.2);
            backdrop-filter: blur(8px);
            max-width: 90%;
            width: 500px;
            z-index: 10;
            transform: scale(0.9);
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }

        h1 {
            color: #d90429;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p {
            color: #4a4a4a;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .date {
            font-weight: bold;
            color: #ef233c;
            display: block;
            margin-top: 15px;
            font-size: 1.4rem;
        }

        .btn-play {
            background-color: #ef233c;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(239, 35, 60, 0.4);
            transition: all 0.3s ease;
        }

        .btn-play:hover {
            background-color: #d90429;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(239, 35, 60, 0.6);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Аудиофайл из сети, зацикленный -->
    <audio id="love-song" src="https://m.muzofond.fm/inst/6f595febe53da7e/dzhigan_-_ya-lyublyu-tebya-ti-tolko-znaj_(muzofond.fm).mp3" loop></audio>

    <div class="container">
        <h1>Полгода вместе! ❤️</h1>
        <p>
            Любимая, сегодня особенный день. Ровно 6 месяцев назад моя жизнь изменилась, 
            и я бесконечно счастлив быть рядом с тобой. Спасибо тебе за твою улыбку, 
            нежность и за каждый прожитый вместе момент!
            <span class="date">27 августа</span>
        </p>
        <button class="btn-play" onclick="startSurprise()">Включить сюрприз</button>
    </div>

    <script>
        function startSurprise() {
            const audio = document.getElementById('love-song');
            const button = document.querySelector('.btn-play');
            
            // Включаем припев (53 секунда)
            audio.currentTime = 53;
            
            audio.play().catch(error => {
                console.log("Браузер заблокировал автозвук:", error);
            });

            button.style.display = 'none';
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const heartTypes = ['❤️', '💖', '💝', '💕'];
            heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            const duration = Math.random() * 3 + 3;
            heart.style.animationDuration = duration + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, duration * 1000);
        }
    </script>
</body>
</html>
