<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши 100 дней</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <style>
        :root {
            --gold: #fde047;
            --red-pure: #ff0000;
            --red-glow: rgba(255, 0, 0, 0.7); 
            --bg-dark: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a0b2e 0%, #050505 100%);
        }

        .section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 25px;
            border-radius: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 3.5em;
            margin: 0;
            background: linear-gradient(135deg, #fff9c4 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .story-text {
            font-size: 1.15em;
            line-height: 1.8;
            color: #cbd5e1;
            margin: 20px 0;
        }

        .highlight { color: var(--red-pure); font-weight: bold; }

        .heart-icon { 
            font-size: 5em; 
            cursor: pointer; 
            color: var(--red-pure);
            display: inline-block;
            margin-top: 20px;
            animation: heartBeat 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes heartBeat {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px var(--red-glow)); }
            15% { transform: scale(1.25); filter: drop-shadow(0 0 25px var(--red-pure)); }
            30% { transform: scale(1); filter: drop-shadow(0 0 5px var(--red-glow)); }
            45% { transform: scale(1.15); filter: drop-shadow(0 0 15px var(--red-pure)); }
            60% { transform: scale(1); filter: drop-shadow(0 0 5px var(--red-glow)); }
        }

        .btn-invite {
            background: linear-gradient(135deg, var(--red-pure), #8b0000);
            color: white;
            border: none;
            padding: 18px 45px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.3);
            margin-top: 20px;
            transition: transform 0.2s;
