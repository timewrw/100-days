<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши 100 дней</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a0b2e 0%, #050505 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.5;
        }

        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 25px;
            border-radius: 35px;
            text-align: center;
            max-width: 340px;
            width: 85%;
            z-index: 1;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
            animation: appear 1.5s ease-out;
        }

        @keyframes appear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 2.6em;
            margin: 0 0 20px 0;
            background: linear-gradient(135deg, #ffd700 0%, #ff69b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .message {
            font-size: 1.1em;
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .highlight { color: #ff69b4; font-weight: bold; }

        .date-box {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            font-size: 1.6em;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .heart {
            font-size: 3em;
            color: #ff3e3e;
            display: block;
            margin-top: 30px;
            filter: drop-shadow(0 0 10px rgba(255, 62, 62, 0.5));
            animation: beat 1.2s infinite;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="card">
        <h1>100 дней</h1>
        <div class="message">
            За это время мы прошли путь от первой встречи до моментов, которые я храню в сердце. <br><br>
            Спасибо за твою <span class="highlight">искренность</span> и за то, что ты рядом. Хочу, чтобы этот вечер стал для нас <span class="highlight">особенным</span>.
        </div>
        
        <div class="date-box">06.05.2026</div>
        
        <span class="heart">❤</span>
    </div>
</body>
</html>
