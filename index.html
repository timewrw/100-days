<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 дней вместе</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 30px;
            max-width: 400px;
        }
        h1 {
            font-size: 2.8em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .date-box {
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 15px;
            border-radius: 15px;
            background: rgba(30, 41, 59, 0.5);
            display: inline-block;
        }
        .date {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.5em;
            display: block;
        }
        .heart {
            color: #ef4444;
            font-size: 1.8em;
            display: block;
            margin-top: 30px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>100 дней</h1>
        <p>Это были прекрасные три месяца, и это только начало.<br><br>Я приглашаю тебя отметить нашу первую круглую дату вместе.</p>
        
        <div class="date-box">
            <span class="date">6 мая 2026</span>
        </div>
        
        <span class="heart">❤</span>
    </div>
</body>
</html>
