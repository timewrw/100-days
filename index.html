<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 дней вместе</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 40px 20px;
            max-width: 500px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.25em;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .date-display {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 10px 30px;
            border-radius: 50px;
            background: rgba(30, 41, 59, 0.4);
            display: inline-block;
        }
        .heart {
            color: #ef4444;
            font-size: 2.5em;
            display: block;
            margin-top: 40px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>100 дней вместе</h1>
        <p>Это было прекрасное время, и это только начало.<br>Я приглашаю тебя отметить нашу первую круглую дату.</p>
        
        <div class="date-display">6 мая 2026</div>
        
        <span class="heart">❤</span>
    </div>
</body>
</html>
